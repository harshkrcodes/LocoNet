spring:
  application:
    name: loconet

  datasource:
    url: jdbc:postgresql://localhost:5432/loconet
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  # MUST be at least 32 bytes (256 bits) for HS256 — Keys.hmacShaKeyFor()
  # in JwtUtil throws at startup if it's shorter. Override via env var in
  # every real environment; this default is for local dev only.
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-3242jkadsfh}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
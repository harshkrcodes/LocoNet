<!DOCTYPE html>
<html>
<head>
    <title>LocoNet Live Test</title>
    <!-- STOMP aur SockJS libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
<h2>LocoNet WebSocket Test</h2>
<button onclick="connect()" style="padding: 10px; background: green; color: white;">Connect to Server</button>
<div id="status" style="margin-top: 20px; font-weight: bold;">Status: Disconnected</div>

<script>
    var stompClient = null;

    function connect() {
        // Apna WebSocket endpoint (Bina SockJS ke normal websocket bhi try kar sakte hain, par Spring Boot mein STOMP SockJS ke sath best chalta hai)
        var socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = 'Status: CONNECTED! Engine Zinda Hai 🔥';
            document.getElementById('status').style.color = 'green';
            console.log('Connected: ' + frame);
        }, function (error) {
            document.getElementById('status').innerText = 'Status: CONNECTION FAILED ❌';
            document.getElementById('status').style.color = 'red';
            console.log('Error: ' + error);
        });
    }
</script>
</body>
</html>
